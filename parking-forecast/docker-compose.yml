#
# One container runs the full pipeline once — ingest, then train, then
# predict, in that order (see src/main.py, the image's default command) —
# and exits. In production each job is instead its own Kubernetes CronJob
# container on its own schedule (see infrastructure/helm); for local dev,
# just re-run this whenever you want fresh data:
#
#   docker compose run --rm pipeline
#
# To run a single job instead of the full pipeline:
#
#   docker compose run --rm pipeline python /app/main.py ingest
#
# ./data is bind-mounted at /app/data and holds the SQLite cache
# (parking.db) plus ./data/result/result.json, served by nginx. Delete
# ./data/parking.db to reset the cache and start ingesting/training from
# scratch.

services:
  pipeline:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: build
    image: parking-forecast
    env_file:
      - .env
    environment:
      RESULT_JSON_PATH: /app/data/result/result.json
    volumes:
      - ./data:/app/data

  nginx:
    image: nginx:latest
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./data/result:/usr/share/nginx/html:ro
